---
############################################################
# PR validation pipeline.                                  #
#                                                          #
# Runs on every PR targeting main.                         #
#                                                          #
# renovate-gate is the single required PR check. It is the #
# fan-in point for PR validation checks.                   #
#                                                          #
# Renovate needs a status check to enable auto-merge PRs.  #
############################################################

name: PR checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest

    outputs:
      mise: ${{ steps.filter.outputs.mise }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect mise validation changes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if mise_changed="$(
            bash .scripts/mise/detect-validation-changes.sh \
              "$BASE_SHA" \
              "$HEAD_SHA"
          )"; then
            echo "mise=$mise_changed" >> "$GITHUB_OUTPUT"
          else
            status=$?

            echo "Change detection failed."
            echo "The Docker build job will not run, and Renovate gate will fail."
            exit "$status"
          fi

  mise-check:
    name: Install mise tools
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.mise == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build mise installation check
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --pull \
            --progress=plain \
            --file .containers/ci/mise.Dockerfile \
            --target mise-check \
            --tag mise-pr-check:local \
            .

  renovate-gate:
    name: Renovate gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - mise-check
    if: always()

    steps:
      - name: Check PR validation results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MISE_CHECK_RESULT: ${{ needs.mise-check.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed or was cancelled: $CHANGES_RESULT"
            exit 1
          fi

          case "$MISE_CHECK_RESULT" in
            success|skipped)
              ;;
            *)
              echo "Mise validation failed or was cancelled: $MISE_CHECK_RESULT"
              exit 1
              ;;
          esac

          echo "All required PR checks passed."
